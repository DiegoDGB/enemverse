<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnemVerse - Acessar o Universo</title>
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-universe-bg">

    <div class="auth-card">
        <div class="auth-brand" onclick="window.location.href='index.html'">🌌 EnemVerse</div>

        <div class="auth-tabs">
            <button type="button" class="tab-btn active" id="btnIrParaLogin">Acessar Conta</button>
            <button type="button" class="tab-btn" id="btnIrParaCadastro">Cadastrar</button>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="formLogin">
            <div class="auth-error-message hidden" id="errorBoxLogin"></div>
            <div class="form-group">
                <label for="loginEmail">E-MAIL</label>
                <input type="email" id="loginEmail" placeholder="seuemail@provedor.com" required>
            </div>
            <div class="form-group">
                <label for="loginSenha">SENHA</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha" required>
            </div>
            <button type="submit" class="submit-btn">Entrar no Universo</button>
        </form>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="formCadastro" class="hidden">
            <div class="auth-error-message hidden" id="errorBoxCadastro"></div>
            <div class="form-group">
                <label for="regNome">NOME COMPLETO</label>
                <input type="text" id="regNome" placeholder="Seu nome completo" required>
            </div>
            <div class="form-group">
                <label for="regEmail">E-MAIL</label>
                <input type="email" id="regEmail" placeholder="seuemail@provedor.com" required>
            </div>
            <div class="form-group">
                <label for="regSenha">SENHA</label>
                <input type="password" id="regSenha" placeholder="Crie uma senha forte" required>
            </div>
            <button type="submit" class="submit-btn">Criar Minha Conta</button>
        </form>

        <a href="index.html" class="back-home-link">← Voltar para a vitrine</a>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const formLogin = document.getElementById('formLogin');
        const formCadastro = document.getElementById('formCadastro');
        const btnIrParaCadastro = document.getElementById('btnIrParaCadastro');
        const btnIrParaLogin = document.getElementById('btnIrParaLogin');
        const errorBoxLogin = document.getElementById('errorBoxLogin');
        const errorBoxCadastro = document.getElementById('errorBoxCadastro');

        // URL Base Limpa do StackBlitz
        const API_BASE = 'https://onrender.com';

        if (btnIrParaCadastro) {
            btnIrParaCadastro.addEventListener('click', (e) => {
                e.preventDefault();
                formLogin.classList.add('hidden');
                formCadastro.classList.remove('hidden');
                btnIrParaCadastro.classList.add('active');
                btnIrParaLogin.classList.remove('active');
                limparMensagensErro();
            });
        }

        if (btnIrParaLogin) {
            btnIrParaLogin.addEventListener('click', (e) => {
                e.preventDefault();
                formCadastro.classList.add('hidden');
                formLogin.classList.remove('hidden');
                btnIrParaLogin.classList.add('active');
                btnIrParaCadastro.classList.remove('active');
                limparMensagensErro();
            });
        }

        function limparMensagensErro() {
            if (errorBoxLogin) errorBoxLogin.classList.add('hidden');
            if (errorBoxCadastro) errorBoxCadastro.classList.add('hidden');
            document.querySelectorAll('input').forEach(input => input.classList.remove('input-field-error'));
        }

        function exibirErro(elementoBox, mensagem) {
            if (!elementoBox) return;
            elementoBox.innerText = mensagem;
            elementoBox.classList.remove('hidden');
        }

        if (formCadastro) {
            formCadastro.addEventListener('submit', async (e) => {
                e.preventDefault();
                limparMensagensErro();

                const nome = document.getElementById('regNome').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const senha = document.getElementById('regSenha').value;

                try {
                    // Sincronização exata com o req.url.startsWith do Node.js
                    const resposta = await fetch(`${API_BASE}/api/auth/cadastrar`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nome, email, senha })
                    });

                    const dados = await resposta.json();

                    if (!resposta.ok) {
                        exibirErro(errorBoxCadastro, dados.erro || 'Erro ao realizar cadastro.');
                        return;
                    }

                    alert('Cadastro realizado com sucesso! Faça o seu login.');
                    btnIrParaLogin.click(); 

                } catch (erro) {
                    console.error(erro);
                    exibirErro(errorBoxCadastro, 'Não foi possível conectar ao servidor da nuvem.');
                }
            });
        }

        if (formLogin) {
            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                limparMensagensErro();

                const email = document.getElementById('loginEmail').value.trim();
                const senha = document.getElementById('loginSenha').value;

                try {
                    // Sincronização exata com o req.url.startsWith do Node.js
                    const resposta = await fetch(`${API_BASE}/api/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, senha })
                    });

                    const dados = await resposta.json();

                    if (!resposta.ok) {
                        exibirErro(errorBoxLogin, dados.erro || 'E-mail ou senha incorretos.');
                        return;
                    }

                    localStorage.setItem('enemverse_email_ativo', dados.email);
                    localStorage.setItem('enemverse_username', dados.nome);
                    localStorage.setItem('enemverse_xp', dados.xp);
                    localStorage.setItem('enemverse_streak', dados.ofensiva);

                    window.location.href = 'dashboard.html';

                } catch (erro) {
                    console.error(erro);
                    exibirErro(errorBoxLogin, 'Não foi possível conectar ao servidor da nuvem.');
                }
            });
        }
    });
    </script>
</body>
</html>
